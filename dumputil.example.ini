# Copy to dumputil.ini at your repo root. Found from cwd or any parent; or --config FILE / $DUMPUTIL_CONFIG.
# [DEFAULT] keys apply to every profile; a [name] section overrides them. --profile name / $DUMPUTIL_PROFILE.
# Path keys (pg_bin, neo4j_home, neo4j_conf, java_home, secrets) resolve relative to this file.
# No passwords here: `secrets` is a KEY=VALUE env file outside the repo; *_password_var names the key.

[DEFAULT]
pg_db              = app
pg_user            = postgres
pg_password_var    = PG_SUPER_PASSWORD
neo4j_uri          = bolt://localhost:7687
neo4j_user         = neo4j
neo4j_password_var = NEO4J_SUPER_PASSWORD
neo_node_key       = uid
neo_scratch_port   = 17687
secrets            = /etc/app/secrets.env

[local]
pg_bin     = /Library/PostgreSQL/17/bin
pg_host    = localhost
pg_port    = 5432
neo4j_home = lib/neo4j/5.26
neo4j_conf = ../data/db/neo4j-conf
java_home  = lib/jdk/21/darwin-arm64

[dev]
pg_bin     = /usr/lib/postgresql/17/bin
neo4j_home = /opt/neo4j/current
neo4j_conf = /opt/neo4j/current/conf
